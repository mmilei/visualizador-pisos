<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono del visualizador: tablas de piso en perspectiva sobre fondo terracota. Fuente de icono-*.png
       (se rasterizan con generar-iconos.html). Sin márgenes críticos fuera del 80% central (maskable). -->
  <rect width="512" height="512" fill="#b5651d"/>
  <g transform="translate(256 285) scale(.82) translate(-256 -285)">
  <defs>
    <clipPath id="piso"><polygon points="146,170 366,170 470,400 42,400"/></clipPath>
  </defs>
  <polygon points="146,170 366,170 470,400 42,400" fill="#e8c9a0"/>
  <g clip-path="url(#piso)" stroke="#7a3f10" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="201" y1="170" x2="149" y2="400"/>
    <line x1="256" y1="170" x2="256" y2="400"/>
    <line x1="311" y1="170" x2="363" y2="400"/>
    <line x1="173" y1="225" x2="229" y2="225"/>
    <line x1="283" y1="268" x2="339" y2="268"/>
    <line x1="120" y1="320" x2="203" y2="320"/>
    <line x1="256" y1="352" x2="340" y2="352"/>
    <line x1="228" y1="195" x2="284" y2="195"/>
  </g>
  <polygon points="146,170 366,170 470,400 42,400" fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="146" cy="170" r="16" fill="#ffd166" stroke="#fff" stroke-width="6"/>
  <circle cx="366" cy="170" r="16" fill="#ffd166" stroke="#fff" stroke-width="6"/>
  <circle cx="470" cy="400" r="16" fill="#ffd166" stroke="#fff" stroke-width="6"/>
  <circle cx="42" cy="400" r="16" fill="#ffd166" stroke="#fff" stroke-width="6"/>
  </g>
</svg>
